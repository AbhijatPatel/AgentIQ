services:
  - type: web
    name: agentiq-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: agentiq-db
          property: connectionString

      - key: FRONTEND_ORIGIN
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: OPENAI_API_KEY
        sync: false

      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"

      - key: TAVILY_API_KEY
        sync: false

      - key: PEXELS_API_KEY
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM_EMAIL
        sync: false

databases:
  - name: agentiq-db
    plan: free
