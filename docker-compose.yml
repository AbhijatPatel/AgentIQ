services:
  postgres:
    image: postgres:16
    container_name: agentiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentiq123}
      POSTGRES_DB: agentiq
    ports:
      - "5432:5432"
    volumes:
      - agentiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agentiq-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_ORIGIN: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_TIMEOUT_SECONDS: 60
      LLM_MAX_RETRIES: 2
      LLM_TEMPERATURE: 0.2
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-agentiq123}@postgres:5432/agentiq
    ports:
      - "8000:8000"
    volumes:
      - agentiq_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agentiq-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  agentiq_pgdata:
  agentiq_data: